# Sentinel supervisor configuration.
#
# Every value has a default; anything omitted here keeps the built-in
# value from sl_sup_config_defaults() in include/sl_sup.h.
#
# Durations accept a unit suffix: 3s, 900ms, 250us, 100000ns.

# Rendezvous path. On QNX this is the resource manager path; on a host
# build it is the AF_UNIX socket.
# listen = /dev/sentinel

# Event log written by the supervisor (binary, CRC per record).
log = /tmp/sentinel.slg

# Write one job record out of every N, to keep the log small on a 1 kHz
# control loop while every miss is still recorded.
log_decimation = 4

# Scheduling priority for the supervisor thread (QNX: 1..63).
# It must outrank every supervised task.
priority = 30

# Predicted overrun probability that trips each mode, in parts per
# million: 2000 = 0.2 %, 20000 = 2 %.
risk_watch_ppm = 2000
risk_degrade_ppm = 20000

# Critical misses inside one window that latch SAFE-STOP.
stop_after_misses = 3
miss_window = 5s

# Clean time with no misses before stepping back down one mode.
recover_after = 3s
